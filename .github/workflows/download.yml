name: Build MRPack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create MRPack with Fabric API, Sodium, & Iris
        run: |
          pip install requests
          python -c '
          import os, requests, json, zipfile

          mc_version = "26.2"
          # Only the 3 requested mods
          mods = ["fabric-api", "sodium", "iris"]
          
          overrides_dir = "pack_build/overrides/mods"
          os.makedirs(overrides_dir, exist_ok=True)

          headers = {"User-Agent": "GitHubActions-MRPackBuilder/1.0"}

          print("--- Fetching Mods: Fabric API, Sodium, Iris ---")
          for slug in mods:
              url = f"https://api.modrinth.com/v2/project/{slug}/version?game_versions=[\"{mc_version}\"]&loaders=[\"fabric\"]"
              res = requests.get(url, headers=headers).json()
              if res:
                  file_info = res[0]["files"][0]
                  file_url = file_info["url"]
                  filename = file_info["filename"]
                  print(f"Downloading {filename}...")
                  r = requests.get(file_url, headers=headers)
                  with open(os.path.join(overrides_dir, filename), "wb") as f:
                      f.write(r.content)
              else:
                  print(f"Notice: No 26.2 tag found for {slug}")

          # Write modrinth.index.json
          index_data = {
              "formatVersion": 1,
              "game": "minecraft",
              "versionId": "1.0.0",
              "name": "Fabric 26.2 Essentials",
              "summary": "Minecraft 26.2 Fabric with Fabric API, Sodium, and Iris",
              "files": [],
              "dependencies": {
                  "minecraft": mc_version,
                  "fabric-loader": "0.19.3"
              }
          }

          with open("pack_build/modrinth.index.json", "w") as f:
              json.dump(index_data, f, indent=2)

          # Compress into .mrpack format
          with zipfile.ZipFile("Fabric_26_2_Essentials.mrpack", "w", zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk("pack_build"):
                  for file in files:
                      full_path = os.path.join(root, file)
                      rel_path = os.path.relpath(full_path, "pack_build")
                      zf.write(full_path, rel_path)

          print("--- .mrpack creation complete ---")
          '

      - name: Upload .mrpack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fabric_26_2_Essentials_MRPack
          path: Fabric_26_2_Essentials.mrpack
